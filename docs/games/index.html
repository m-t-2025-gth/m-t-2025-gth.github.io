<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Portfolio</title>

    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/section.css" />
    <link rel="stylesheet" href="/assets/css/navbar.css" />
    <link rel="stylesheet" href="/assets/css/footer.css" />

    <link rel="stylesheet" href="/assets/css/portfolio/gameIntroduce.css" />
    <link rel="stylesheet" href="/assets/css/portfolio/portfolio.css" />
  </head>

  <body>
    <header>
      <nav class="navbar">
        <a href="/">TOP</a>

        <a href="/#profile">PROFILE</a>

        <a href="#portfolio">PORTFOLIO</a>
      </nav>
    </header>

    <main class="portfolio-detail">
      <!-- ゲーム名 -->
      <h1 id="game-title"></h1>

      <!-- YouTube動画 -->
      <div class="game-video-container">
        <iframe
          id="game-video"
          src=""
          title="YouTube video player"
          frameborder="0"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          allowfullscreen
        ></iframe>
      </div>

      <!-- Tag -->
      <section class="game-info">
        <div id="game-tags" class="game-tags"></div>
      </section>

      <!-- Award -->
      <section id="award-section" class="game-info">
        <h2>Award (賞歴)</h2>
        <p id="game-award"></p>
      </section>

      <!-- Description -->
      <section id="description-section" class="game-info">
        <h2>Description (作品説明)</h2>

        <p id="game-description"></p>
      </section>

      <!-- Comment -->
      <section id="comment-section" class="game-info">
        <h2>Comment (コメント)</h2>

        <p id="game-comment"></p>
      </section>

      <!-- Good -->
      <section id="good-section" class="game-info">
        <h2>Good (工夫したところ)</h2>

        <p id="game-good"></p>
      </section>

      <!-- Bad -->
      <section id="bad-section" class="game-info">
        <h2>Bad (反省するところ)</h2>

        <p id="game-bad"></p>
      </section>
    </main>

    <section id="portfolio" class="content-section">
      <h2>PORTFOLIO</h2>

      <p>制作した作品をここに掲載しています。</p>

      <div id="portfolio-list"></div>
    </section>

    <footer class="footer">
      <nav class="footer-nav">
        <a href="/">TOP</a>
        <a href="/#profile">PROFILE</a>
        <a href="#portfolio">PORTFOLIO</a>
      </nav>

      <p class="footer-copy">© 2026 M Tee. All Rights Reserved.</p>
    </footer>

    <script src="/assets/scripts/gameIntroduce.js"></script>
    <script src="/assets/scripts/gamePreview.js"></script>
  </body>
</html>
